<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — BidHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <div id="nav-placeholder"></div>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <!-- Logo -->
        <div class="text-center mb-8">
          <a href="/" class="inline-flex items-center gap-2 mb-4">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
              <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <span class="text-2xl font-bold text-indigo-600">BidHub</span>
          </a>
          <h1 class="text-xl font-bold text-gray-900">Create your account</h1>
          <p class="text-sm text-gray-500 mt-1">Requires a <span class="text-indigo-600 font-medium">@stud.noroff.no</span> email</p>
        </div>

        <!-- Info banner -->
        <div class="mb-5 p-3 bg-indigo-50 border border-indigo-100 rounded-xl flex gap-2">
          <svg class="w-4 h-4 text-indigo-500 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p class="text-xs text-indigo-700">You'll receive <strong>1,000 credits</strong> to start bidding right away!</p>
        </div>

        <!-- Error banner -->
        <div id="error-banner"
          class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm">
        </div>

        <form id="register-form" class="space-y-4" novalidate>
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
            <input
              id="name" name="name" type="text" autocomplete="username" required
              placeholder="e.g. john_doe123"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
            >
            <p class="text-xs text-gray-400 mt-1">Letters, numbers and underscores only</p>
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input
              id="email" name="email" type="email" autocomplete="email" required
              placeholder="you@stud.noroff.no"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
            >
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
            <div class="relative">
              <input
                id="password" name="password" type="password" autocomplete="new-password" required
                placeholder="Min 8 characters"
                class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition pr-10"
              >
              <button type="button" id="toggle-pw"
                class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>

          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
            <input
              id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required
              placeholder="Repeat your password"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
            >
          </div>

          <!-- Optional fields toggle -->
          <details class="group">
            <summary class="text-sm text-indigo-600 hover:underline cursor-pointer list-none flex items-center gap-1">
              <svg class="w-4 h-4 group-open:rotate-90 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
              Add optional profile details
            </summary>
            <div class="mt-3 space-y-3">
              <div>
                <label for="bio" class="block text-sm font-medium text-gray-700 mb-1.5">Bio</label>
                <textarea id="bio" name="bio" rows="2"
                  placeholder="A short bio about yourself..."
                  class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none transition"></textarea>
              </div>
              <div>
                <label for="avatarUrl" class="block text-sm font-medium text-gray-700 mb-1.5">Avatar URL</label>
                <input id="avatarUrl" name="avatarUrl" type="url"
                  placeholder="https://example.com/avatar.jpg"
                  class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition">
              </div>
            </div>
          </details>

          <button
            id="submit-btn" type="submit"
            class="w-full py-3 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 disabled:opacity-60 disabled:cursor-not-allowed mt-2">
            Create Account
          </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
          Already have an account?
          <a href="/auth/login.html" class="text-indigo-600 hover:underline font-medium">Log In</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module" src="/src/pages/register.ts"></script>

  <script>
    document.getElementById("toggle-pw")?.addEventListener("click", () => {
      const pw = document.getElementById("password");
      pw.type = pw.type === "password" ? "text" : "password";
    });
  </script>
</body>
</html>
