<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuctionHouse – Browse Listings</title>
  <script type="module" crossorigin src="/Sp2/assets/index-CD-xZukL.js"></script>
  <link rel="modulepreload" crossorigin href="/Sp2/assets/showMessage-Do1J44am.js">
  <link rel="modulepreload" crossorigin href="/Sp2/assets/renderListingCard-Ba3jJfl1.js">
  <link rel="modulepreload" crossorigin href="/Sp2/assets/listingEvents-Bjv4WE3C.js">
  <link rel="stylesheet" crossorigin href="/Sp2/assets/showMessage-BHBE5pjm.css">
</head>
<body>

  <div id="nav-placeholder"></div>

  <main class="container py-4">

    <!-- Hero search -->
<div class="hero-banner text-white text-center p-4 mb-4">
  <h1 class="fw-bold mb-1 hero-title">Worth Discovering</h1>

  <p class="mb-3 hero-text">
    Browse thousands of student auction listings
  </p>

  <div class="input-group mx-auto search-bar">
    <input
      type="text"
      id="search-input"
      class="form-control form-control-lg"
      placeholder="Search listings…"
    >

    <button id="search-btn" class="btn btn-warning fw-semibold">
      <i class="bi bi-search"></i> Search
    </button>
  </div>
</div>

    <!-- Tag filter -->
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
      <span class="text-muted small fw-semibold">Filter:</span>
      <button class="btn btn-sm btn-outline-secondary tag-filter active" data-tag="">All</button>
      <button class="btn btn-sm btn-outline-secondary tag-filter" data-tag="electronics">Electronics</button>
      <button class="btn btn-sm btn-outline-secondary tag-filter" data-tag="fashion">Fashion</button>
      <button class="btn btn-sm btn-outline-secondary tag-filter" data-tag="books">Books</button>
      <button class="btn btn-sm btn-outline-secondary tag-filter" data-tag="art">Art</button>
      <button class="btn btn-sm btn-outline-secondary tag-filter" data-tag="sports">Sports</button>
      <button class="btn btn-sm btn-outline-secondary tag-filter" data-tag="music">Music</button>
      <button class="btn btn-sm btn-outline-secondary tag-filter" data-tag="vintage">Vintage</button>
    </div>

    <!-- Listings grid -->
    <div id="listings-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-warning" role="status"></div>
      </div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center align-items-center gap-3 mt-4">
      <button id="prev-btn" class="btn btn-outline-secondary" disabled>
        <i class="bi bi-chevron-left"></i> Prev
      </button>
      <span id="page-info" class="text-muted small">Page 1</span>
      <button id="next-btn" class="btn btn-warning fw-semibold">
        Next <i class="bi bi-chevron-right"></i>
      </button>
    </div>

  </main>

  <footer class="text-center text-muted py-4 mt-4 border-top small">
    AuctionHouse &copy; 2026 
  </footer>

</body>
</html>
