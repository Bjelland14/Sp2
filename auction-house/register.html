<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuctionHouse – Register</title>
</head>

<body class="bg-light">

  <div id="nav-placeholder"></div>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">

            <h1 class="h3 mb-3 text-center">Create account</h1>

            <form id="register-form">

              <div class="mb-3">
                <label for="name" class="form-label">Username *</label>

                <input
                  id="name"
                  name="name"
                  class="form-control"
                  placeholder="Yourname"
                  required
                />

                <div class="form-text">
                  No spaces or special characters except underscores.
                </div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email *</label>

                <input
                  id="email"
                  name="email"
                  type="email"
                  class="form-control"
                  placeholder="yourname@stud.noroff.no"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password *</label>

                <input
                  id="password"
                  name="password"
                  type="password"
                  class="form-control"
                  placeholder="Minimum 8 characters"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="confirm-password" class="form-label">
                  Confirm password *
                </label>

                <input
                  id="confirm-password"
                  name="confirm-password"
                  type="password"
                  class="form-control"
                  placeholder="Repeat your password"
                  required
                />
              </div>

              <button class="btn btn-warning w-100" type="submit">
                Register
              </button>

              <p class="text-center mt-3 mb-0">
                Already have an account?

                <a href="./login.html" class="btn btn-outline-primary btn-sm ms-2">
                  Log in
                </a>
              </p>

            </form>

            <div id="form-message" class="mt-3 text-center"></div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-4 mt-4 border-top small">
    AuctionHouse &copy; 2026
  </footer>

  <script type="module" src="./src/pages/register.ts"></script>

</body>
</html>
