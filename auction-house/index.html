<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content=" width=device-width, initial-scale=1.0" />
        <title>Auction House</title>

        <!-- Bootstrap  -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-light">

     <!-- NAVBAR -->
      <header>
     <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Auction House</a>

        <div class="ms-auto d-flex gap-2">
            <a href="login.html" class="btn btn-outline-primary">Login</a>
            <a href="register.html" class="btn btn-primary">Register</a>
        </div>
      </div>
     </nav>
    </header>

<!-- MAIN CONTENT -->
  <main class="container py-5">

    <!-- TITLE -->
    <h1 class="mb-4">Listings</h1>

    <!-- SEARCH -->
    <form id="searchForm" class="mb-4 d-flex gap-2">
      <input
        type="search"
        id="searchInput"
        class="form-control"
        placeholder="Search listings..."
      />
      <button type="submit" class="btn btn-primary">Search</button>
    </form>

<!-- STATUS MESSAGES -->
    <div id="loadingMessage" class="alert alert-info d-none">
      Loading listings...
    </div>

    <div id="errorMessage" class="alert alert-danger d-none">
      Something went wrong.
    </div>

    <div id="emptyMessage" class="alert alert-secondary d-none">
      No listings found.
    </div>

    <!-- LISTINGS GRID -->
    <div class="row g-4" id="listingGrid">
      <!-- Listings kommer her via JS -->
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="text-center py-4 border-top bg-white">
    <p class="mb-0">&copy; 2026 Auction House</p>
  </footer>

  <!-- TypeScript entry -->
  <script type="module" src="/src/main.ts"></script>

  <!-- Bootstrap JS (for evt. dropdowns osv.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
