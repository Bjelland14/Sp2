<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Listing — BidHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <div id="nav-placeholder"></div>

  <main class="flex-1">
    <div class="max-w-2xl mx-auto px-4 py-8">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Create a Listing</h1>
        <p class="text-sm text-gray-500 mt-1">List an item for auction. Your listing will be visible to all users.</p>
      </div>

      <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
        <form id="create-form" class="space-y-5" novalidate>

          <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1.5">
              Title <span class="text-red-500">*</span>
            </label>
            <input id="title" name="title" type="text" required maxlength="280"
              placeholder="What are you selling?"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition">
          </div>

          <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1.5">Description</label>
            <textarea id="description" name="description" rows="4"
              placeholder="Describe your item — condition, history, what's included..."
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-y transition"></textarea>
          </div>

          <div>
            <label for="tags" class="block text-sm font-medium text-gray-700 mb-1.5">Tags</label>
            <input id="tags" name="tags" type="text"
              placeholder="vintage, electronics, rare  (comma-separated)"
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition">
          </div>

          <div>
            <label for="deadline" class="block text-sm font-medium text-gray-700 mb-1.5">
              Auction Deadline <span class="text-red-500">*</span>
            </label>
            <input id="deadline" name="deadline" type="datetime-local" required
              class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 transition">
            <p class="text-xs text-gray-400 mt-1">Must be at least 1 hour in the future</p>
          </div>

          <!-- Images -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Images</label>
            <div id="media-list" class="space-y-2 mb-3 min-h-[2rem]"></div>
            <div class="flex gap-2">
              <input id="media-url" type="url" placeholder="https://example.com/image.jpg"
                class="flex-1 px-3 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
              <input id="media-alt" type="text" placeholder="Alt text"
                class="w-28 px-3 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
              <button type="button" id="add-media-btn"
                class="px-4 py-2 bg-gray-100 text-gray-700 rounded-xl text-sm font-medium hover:bg-gray-200 transition-colors whitespace-nowrap">
                + Add
              </button>
            </div>
          </div>

          <div class="flex gap-3 pt-2 border-t border-gray-100">
            <a href="/"
              class="flex-1 text-center px-5 py-3 border border-gray-200 rounded-xl text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
              Cancel
            </a>
            <button type="submit" id="submit-btn"
              class="flex-1 px-5 py-3 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 disabled:opacity-60 disabled:cursor-not-allowed">
              Create Listing
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="/src/pages/create-listing.ts"></script>
</body>
</html>
